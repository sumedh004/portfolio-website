apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: portfolio-alerts
  namespace: monitoring
  labels:
    # This label is required — tells the Prometheus operator to load this rule
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:

    # ── Node resource alerts ──────────────────────────────
    - name: node.resources
      interval: 1m
      rules:

        - alert: NodeHighCPU
          expr: |
            100 - (avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} CPU usage is {{ $value | printf \"%.1f\" }}% — above 80% for 5 minutes."

        - alert: NodeHighMemory
          expr: |
            (1 - (node_memory_MemAvailable_bytes /
                  node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} memory usage is {{ $value | printf \"%.1f\" }}% — above 85% for 5 minutes."

        - alert: NodeDiskSpaceLow
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} /
                  node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk space low on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} disk usage at {{ $value | printf \"%.1f\" }}% on mountpoint /."

        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node exporter down on {{ $labels.instance }}"
            description: "node-exporter on {{ $labels.instance }} has been unreachable for 2 minutes. The node may be down."

    # ── Pod health alerts ─────────────────────────────────
    - name: pod.health
      interval: 1m
      rules:

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in 15 minutes."

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 5 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="portfolio"}
              != kube_deployment_status_available_replicas{namespace="portfolio"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch"
            description: "Deployment {{ $labels.deployment }} has {{ $value }} fewer available replicas than desired for 5 minutes."

    # ── Portfolio app alerts ──────────────────────────────
    - name: portfolio.app
      interval: 30s
      rules:

        - alert: PortfolioHighErrorRate
          expr: |
            sum(rate(portfolio_requests_total{namespace="portfolio",status=~"5.."}[5m]))
            /
            sum(rate(portfolio_requests_total{namespace="portfolio"}[5m])) * 100 > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Portfolio app high 5xx error rate"
            description: "More than 5% of portfolio requests are returning 5xx errors over the last 5 minutes. Current rate: {{ $value | printf \"%.1f\" }}%."

        - alert: PortfolioHighLatency
          expr: |
            histogram_quantile(0.95,
              rate(portfolio_request_duration_seconds_bucket{namespace="portfolio"}[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Portfolio app p95 latency high"
            description: "95th percentile response time is {{ $value | printf \"%.2f\" }}s — above 2 seconds for 5 minutes."
