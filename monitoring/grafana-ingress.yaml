apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: "monitoring-grafana-https-redirect@kubernetescrd"
spec:
  tls:
    - hosts:
        - grafana.sumedhvartak.pp.ua
      secretName: grafana-tls
  rules:
    - host: grafana.sumedhvartak.pp.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
