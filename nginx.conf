server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — important for any production site
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression — reduces file size sent over the network
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 256;

    # Cache static assets for 7 days
    location ~* .(css|js|ico|png|jpg|jpeg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Main location — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint — Kubernetes will use this to check if the pod is alive
    location /healthz {
        access_log off;
        return 200 "healthy
";
        add_header Content-Type text/plain;
    }

    # Stub status for Prometheus nginx metrics (Week 9)
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}
