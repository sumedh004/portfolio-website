log_format prometheus_format '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Write access logs to shared volume — Python sidecar reads from here
    access_log /var/log/nginx/access.log prometheus_format;
    error_log  /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # nginx stub status for nginx-prometheus-exporter sidecar
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}