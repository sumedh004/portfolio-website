{{- if .Values.ingress.legacy.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: legacy-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: "^https?://(?:www\\.)?sumedhvartak\\.pp\\.ua/(.*)"
    replacement: "https://{{ .Values.ingress.host }}/${1}"
    permanent: true
{{- end }}