{{- if .Values.nginxExporter.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "portfolio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    # This label lets the kube-prometheus-stack operator find this ServiceMonitor
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "portfolio.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}