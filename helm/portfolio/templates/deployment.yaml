apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "portfolio.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "portfolio.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "portfolio.selectorLabels" . | nindent 14 }}
      {{- end }}
      volumes:
        - name: nginx-logs
          emptyDir: {}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
        {{- if .Values.nginxExporter.enabled }}
        - name: nginx-exporter
          image: "{{ .Values.nginxExporter.image }}"
          args:
            - "-nginx.scrape-uri=http://localhost/nginx_status"
          ports:
            - name: nginx-metrics
              containerPort: 9113
              protocol: TCP
          resources:
            {{- toYaml .Values.nginxExporter.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.metricsExporter.enabled }}
        - name: metrics-exporter
          image: "{{ .Values.metricsExporter.image }}"
          env:
            - name: NGINX_LOG_PATH
              value: /var/log/nginx/access.log
            - name: METRICS_PORT
              value: "8000"
          ports:
            - name: app-metrics
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
          resources:
            {{- toYaml .Values.metricsExporter.resources | nindent 12 }}
        {{- end }}
      terminationGracePeriodSeconds: 30